name: Vetted (FKA Lustre)
description: >-
  Vetted (legally Parli, Inc.; formerly Lustre) is a San Francisco-based consumer
  AI shopping agent founded in 2019. It analyzes product reviews and expert content
  across the web and compares prices across retailers such as Amazon, Walmart, and
  Best Buy to help shoppers find high-quality products at the best price. Vetted
  ships as an iOS app, Android app, macOS app, and Chrome extension, and reports
  more than 370,000 shoppers. The company rebranded from Lustre to Vetted alongside
  a $14M Series A led by Insight Partners in August 2022. Vetted is a consumer
  product and does not publish a public developer API, OpenAPI, SDK, or developer
  portal; its api.vetted.ai backend is a private, auth-gated app service.
